name: Business analysis workbench regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability-and-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project with least privilege
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run local SQLite and HTTP workflow integration tests
        run: python Local_System/test_system.py
      - name: Verify workbench browser JavaScript syntax and traceability navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('Local_System/index.html').read_text(encoding='utf-8')
          assert 'data-view="traceability"' in html
          assert "/api/traceability" in html
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/ba-workbench-inline.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/ba-workbench-inline.js
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ba-local-workbench-tests
          retention-days: 14
          if-no-files-found: warn
          path: Quality/local_system_tests.json
